name: Phase 3C-1 - Persistent Task Queue

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase3c-persistent-queue
  cancel-in-progress: false

jobs:
  persistent-queue:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Test Dependencies
        run: |
          python -m pip install pytest==8.3.5

      - name: Create Persistent Task Manager
        run: |
          mkdir -p platform_core/task_queue

          cat > platform_core/task_queue/persistent_task_manager.py <<'PY'
          from copy import deepcopy
          from datetime import datetime, timezone
          from uuid import uuid4


          class PersistentTaskManager:

              STORAGE_KEY = "task_queue:tasks"

              ALLOWED_STATUSES = {
                  "PENDING",
                  "RUNNING",
                  "SUCCESS",
                  "FAILED",
                  "RETRY",
                  "DEAD_LETTER",
              }

              def __init__(self, storage):
                  if storage is None:
                      raise ValueError("Storage is required")

                  self.storage = storage

                  if self.storage.get(self.STORAGE_KEY) is None:
                      self.storage.set(self.STORAGE_KEY, {
                          "tasks": {},
                          "idempotency": {},
                      })

              def _load(self):
                  data = self.storage.get(self.STORAGE_KEY)

                  if not isinstance(data, dict):
                      return {
                          "tasks": {},
                          "idempotency": {},
                      }

                  return deepcopy(data)

              def _save(self, data):
                  return self.storage.set(
                      self.STORAGE_KEY,
                      data,
                  )

              def create_task(
                  self,
                  task_type,
                  payload=None,
                  priority=5,
                  idempotency_key=None,
              ):
                  if not isinstance(task_type, str) or not task_type:
                      raise ValueError("task_type is required")

                  if not isinstance(priority, int):
                      raise ValueError("priority must be an integer")

                  data = self._load()

                  if idempotency_key is not None:
                      existing_id = data["idempotency"].get(
                          idempotency_key
                      )

                      if existing_id:
                          existing = data["tasks"].get(existing_id)

                          if existing:
                              return deepcopy(existing)

                  now = datetime.now(timezone.utc).isoformat()
                  task_id = str(uuid4())

                  task = {
                      "task_id": task_id,
                      "task_type": task_type,
                      "payload": deepcopy(payload or {}),
                      "priority": priority,
                      "status": "PENDING",
                      "retry_count": 0,
                      "created_at": now,
                      "updated_at": now,
                      "idempotency_key": idempotency_key,
                  }

                  data["tasks"][task_id] = task

                  if idempotency_key is not None:
                      data["idempotency"][idempotency_key] = task_id

                  self._save(data)

                  return deepcopy(task)

              def get_task(self, task_id):
                  data = self._load()
                  task = data["tasks"].get(task_id)

                  return deepcopy(task) if task else None

              def update_status(self, task_id, status):
                  if status not in self.ALLOWED_STATUSES:
                      raise ValueError("Invalid task status")

                  data = self._load()

                  if task_id not in data["tasks"]:
                      raise KeyError(task_id)

                  task = data["tasks"][task_id]
                  task["status"] = status
                  task["updated_at"] = datetime.now(
                      timezone.utc
                  ).isoformat()

                  self._save(data)

                  return deepcopy(task)

              def list_tasks(self, status=None):
                  data = self._load()
                  tasks = list(data["tasks"].values())

                  if status is not None:
                      tasks = [
                          task for task in tasks
                          if task["status"] == status
                      ]

                  tasks.sort(
                      key=lambda task: (
                          task["priority"],
                          task["created_at"],
                      )
                  )

                  return deepcopy(tasks)

              def get_next_pending_task(self):
                  pending = self.list_tasks(status="PENDING")

                  return pending[0] if pending else None

              def delete_task(self, task_id):
                  data = self._load()

                  task = data["tasks"].pop(task_id, None)

                  if task is None:
                      return False

                  key = task.get("idempotency_key")

                  if key is not None:
                      data["idempotency"].pop(key, None)

                  self._save(data)

                  return True
          PY

      - name: Create Persistent Queue Tests
        run: |
          mkdir -p tests

          cat > tests/test_phase3c_persistent_queue.py <<'PY'
          import pytest

          from platform_core.storage.memory_storage import InMemoryStorage
          from platform_core.task_queue.persistent_task_manager import (
              PersistentTaskManager,
          )


          @pytest.fixture
          def storage():
              return InMemoryStorage()


          @pytest.fixture
          def manager(storage):
              return PersistentTaskManager(storage)


          def test_create_task(manager):
              task = manager.create_task("example.worker", {"value": 10})

              assert task["task_type"] == "example.worker"
              assert task["status"] == "PENDING"


          def test_task_is_retrievable(manager):
              task = manager.create_task("example.worker")

              saved = manager.get_task(task["task_id"])

              assert saved["task_id"] == task["task_id"]


          def test_storage_survives_manager_recreation(storage):
              first = PersistentTaskManager(storage)

              task = first.create_task(
                  "example.worker",
                  {"value": 25},
              )

              second = PersistentTaskManager(storage)

              saved = second.get_task(task["task_id"])

              assert saved is not None
              assert saved["payload"]["value"] == 25


          def test_status_persistence(storage):
              first = PersistentTaskManager(storage)

              task = first.create_task("example.worker")

              first.update_status(task["task_id"], "SUCCESS")

              second = PersistentTaskManager(storage)

              saved = second.get_task(task["task_id"])

              assert saved["status"] == "SUCCESS"


          def test_duplicate_idempotency_key(manager):
              first = manager.create_task(
                  "example.worker",
                  {"value": 1},
                  idempotency_key="job-001",
              )

              second = manager.create_task(
                  "example.worker",
                  {"value": 2},
                  idempotency_key="job-001",
              )

              assert first["task_id"] == second["task_id"]
              assert len(manager.list_tasks()) == 1


          def test_priority_order(manager):
              manager.create_task("low", priority=10)
              manager.create_task("high", priority=1)

              tasks = manager.list_tasks()

              assert tasks[0]["task_type"] == "high"


          def test_pending_task_retrieval(manager):
              manager.create_task("first", priority=5)
              manager.create_task("second", priority=1)

              task = manager.get_next_pending_task()

              assert task["task_type"] == "second"


          def test_invalid_status_rejected(manager):
              task = manager.create_task("example.worker")

              with pytest.raises(ValueError):
                  manager.update_status(
                      task["task_id"],
                      "UNKNOWN",
                  )


          def test_missing_task_raises_key_error(manager):
              with pytest.raises(KeyError):
                  manager.update_status("missing-id", "SUCCESS")


          def test_delete_task(manager):
              task = manager.create_task("example.worker")

              assert manager.delete_task(task["task_id"]) is True
              assert manager.get_task(task["task_id"]) is None
          PY

      - name: Run Persistent Queue Tests
        run: |
          python -m pytest tests/test_phase3c_persistent_queue.py -v

      - name: Compile Python Files
        run: |
          python -m compileall -q platform_core tests

      - name: Commit Phase 3C-1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add platform_core/task_queue/persistent_task_manager.py
          git add tests/test_phase3c_persistent_queue.py

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add Phase 3C-1 persistent task queue"
            git push
          fi
