name: Phase 3C-8C Recovery Lease Protection Tests

on:
  workflow_dispatch:

  push:
    paths:
      - "platform_core/task_queue/recovery_controller.py"
      - "tests/test_recovery_lease_protection.py"
      - ".github/workflows/phase3c8c-recovery-lease-tests.yml"

permissions:
  contents: read

jobs:
  recovery-lease-tests:

    name: Validate Recovery Lease Protection

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest==8.3.5

      - name: Verify Required Files
        run: |
          test -f platform_core/task_queue/recovery_controller.py
          test -f tests/test_recovery_lease_protection.py

      - name: Run Recovery Lease Protection Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -v tests/test_recovery_lease_protection.py

      - name: Compile Recovery Controller
        run: |
          python -m py_compile platform_core/task_queue/recovery_controller.py

      - name: Validation Completed
        run: |
          echo "Recovery Lease Protection Validation Completed"
