name: Phase 3C-2 - Task Lifecycle Management

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase3c-task-lifecycle
  cancel-in-progress: false

jobs:
  lifecycle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install pytest==8.3.5

      - name: Create Task Lifecycle Manager
        run: |
          cat > platform_core/task_queue/task_lifecycle_manager.py <<'PY'
          from copy import deepcopy
          from datetime import datetime, timezone


          class TaskLifecycleManager:

              TRANSITIONS = {
                  "PENDING": {"RUNNING"},
                  "RUNNING": {"SUCCESS", "FAILED"},
                  "FAILED": {"RETRY", "DEAD_LETTER"},
                  "RETRY": {"RUNNING", "DEAD_LETTER"},
                  "SUCCESS": set(),
                  "DEAD_LETTER": set(),
              }

              def __init__(self, task_manager):
                  if task_manager is None:
                      raise ValueError("TaskManager is required")

                  self.task_manager = task_manager
                  self.storage = task_manager.storage
                  self.storage_key = task_manager.STORAGE_KEY

              def _now(self):
                  return datetime.now(timezone.utc).isoformat()

              def _load(self):
                  data = self.storage.get(self.storage_key)

                  if not isinstance(data, dict):
                      raise ValueError("Invalid task storage")

                  return deepcopy(data)

              def _save(self, data):
                  return self.storage.set(self.storage_key, data)

              def transition(self, task_id, new_status, details=None):
                  if new_status not in self.TRANSITIONS:
                      raise ValueError("Unknown status")

                  data = self._load()
                  task = data["tasks"].get(task_id)

                  if task is None:
                      raise KeyError(task_id)

                  old_status = task["status"]

                  if new_status not in self.TRANSITIONS.get(
                      old_status, set()
                  ):
                      raise ValueError(
                          f"Invalid transition: {old_status} -> {new_status}"
                      )

                  now = self._now()

                  task["status"] = new_status
                  task["updated_at"] = now

                  if "history" not in task:
                      task["history"] = []

                  event = {
                      "from_status": old_status,
                      "to_status": new_status,
                      "timestamp": now,
                      "details": details,
                  }

                  task["history"].append(event)

                  if new_status == "RUNNING":
                      task["started_at"] = now

                  elif new_status == "SUCCESS":
                      task["completed_at"] = now

                  elif new_status == "FAILED":
                      task["failed_at"] = now

                  elif new_status == "RETRY":
                      task["retry_count"] = (
                          task.get("retry_count", 0) + 1
                      )
                      task["last_retry_at"] = now

                  elif new_status == "DEAD_LETTER":
                      task["dead_letter_at"] = now

                  self._save(data)

                  return deepcopy(task)

              def mark_running(self, task_id):
                  return self.transition(task_id, "RUNNING")

              def mark_success(self, task_id, details=None):
                  return self.transition(
                      task_id, "SUCCESS", details
                  )

              def mark_failed(self, task_id, details=None):
                  return self.transition(
                      task_id, "FAILED", details
                  )

              def schedule_retry(self, task_id, details=None):
                  return self.transition(
                      task_id, "RETRY", details
                  )

              def move_to_dead_letter(self, task_id, details=None):
                  return self.transition(
                      task_id, "DEAD_LETTER", details
                  )

              def get_history(self, task_id):
                  task = self.task_manager.get_task(task_id)

                  if task is None:
                      raise KeyError(task_id)

                  return deepcopy(task.get("history", []))
          PY

      - name: Create Lifecycle Tests
        run: |
          cat > tests/test_phase3c_task_lifecycle.py <<'PY'
          import pytest

          from platform_core.storage.memory_storage import InMemoryStorage
          from platform_core.task_queue.persistent_task_manager import (
              PersistentTaskManager,
          )
          from platform_core.task_queue.task_lifecycle_manager import (
              TaskLifecycleManager,
          )


          @pytest.fixture
          def setup():
              storage = InMemoryStorage()
              manager = PersistentTaskManager(storage)
              lifecycle = TaskLifecycleManager(manager)

              task = manager.create_task("example.worker")

              return manager, lifecycle, task["task_id"]


          def test_pending_to_running(setup):
              manager, lifecycle, task_id = setup

              task = lifecycle.mark_running(task_id)

              assert task["status"] == "RUNNING"
              assert task["started_at"] is not None


          def test_running_to_success(setup):
              manager, lifecycle, task_id = setup

              lifecycle.mark_running(task_id)
              task = lifecycle.mark_success(task_id)

              assert task["status"] == "SUCCESS"
              assert task["completed_at"] is not None


          def test_running_to_failed(setup):
              manager, lifecycle, task_id = setup

              lifecycle.mark_running(task_id)
              task = lifecycle.mark_failed(task_id, "Test error")

              assert task["status"] == "FAILED"
              assert task["failed_at"] is not None


          def test_failed_to_retry(setup):
              manager, lifecycle, task_id = setup

              lifecycle.mark_running(task_id)
              lifecycle.mark_failed(task_id)
              task = lifecycle.schedule_retry(task_id)

              assert task["status"] == "RETRY"
              assert task["retry_count"] == 1


          def test_retry_to_running(setup):
              manager, lifecycle, task_id = setup

              lifecycle.mark_running(task_id)
              lifecycle.mark_failed(task_id)
              lifecycle.schedule_retry(task_id)

              task = lifecycle.mark_running(task_id)

              assert task["status"] == "RUNNING"


          def test_failed_to_dead_letter(setup):
              manager, lifecycle, task_id = setup

              lifecycle.mark_running(task_id)
              lifecycle.mark_failed(task_id)

              task = lifecycle.move_to_dead_letter(task_id)

              assert task["status"] == "DEAD_LETTER"
              assert task["dead_letter_at"] is not None


          def test_invalid_transition_rejected(setup):
              manager, lifecycle, task_id = setup

              with pytest.raises(ValueError):
                  lifecycle.mark_success(task_id)


          def test_success_is_terminal(setup):
              manager, lifecycle, task_id = setup

              lifecycle.mark_running(task_id)
              lifecycle.mark_success(task_id)

              with pytest.raises(ValueError):
                  lifecycle.mark_running(task_id)


          def test_history_tracking(setup):
              manager, lifecycle, task_id = setup

              lifecycle.mark_running(task_id)
              lifecycle.mark_success(task_id)

              history = lifecycle.get_history(task_id)

              assert len(history) == 2
              assert history[0]["to_status"] == "RUNNING"
              assert history[1]["to_status"] == "SUCCESS"


          def test_history_persists_after_manager_recreation(setup):
              manager, lifecycle, task_id = setup

              lifecycle.mark_running(task_id)
              lifecycle.mark_failed(task_id)

              new_manager = PersistentTaskManager(manager.storage)
              new_lifecycle = TaskLifecycleManager(new_manager)

              history = new_lifecycle.get_history(task_id)

              assert len(history) == 2
              assert history[-1]["to_status"] == "FAILED"


          def test_missing_task_rejected(setup):
              manager, lifecycle, task_id = setup

              with pytest.raises(KeyError):
                  lifecycle.mark_running("missing-task")


          def test_retry_count_increments(setup):
              manager, lifecycle, task_id = setup

              lifecycle.mark_running(task_id)
              lifecycle.mark_failed(task_id)
              lifecycle.schedule_retry(task_id)
              lifecycle.mark_running(task_id)
              lifecycle.mark_failed(task_id)
              task = lifecycle.schedule_retry(task_id)

              assert task["retry_count"] == 2
          PY

      - name: Run Lifecycle Tests
        run: |
          python -m pytest tests/test_phase3c_task_lifecycle.py -v

      - name: Compile Python Files
        run: |
          python -m compileall -q platform_core tests

      - name: Commit Phase 3C-2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add platform_core/task_queue/task_lifecycle_manager.py
          git add tests/test_phase3c_task_lifecycle.py

          git commit -m "Add Phase 3C-2 task lifecycle management" || echo "No changes to commit"
          git push
