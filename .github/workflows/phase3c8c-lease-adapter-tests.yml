name: Phase 3C-8C Lease Adapter Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lease-adapter-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests

      - name: Compile Platform
        run: |
          python -m compileall -q platform_core

      - name: Run Lease Adapter Tests
        run: |
          python -m pytest -v tests/test_apps_script_lease.py
