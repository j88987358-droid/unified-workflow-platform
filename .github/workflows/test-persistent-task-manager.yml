name: Persistent Task Manager Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tests/test_persistent_task_manager.py"
      - "platform_core/task_queue/persistent_task_manager.py"
      - "platform_core/storage/memory_storage.py"

permissions:
  contents: read

jobs:
  test:
    name: Run Persistent Task Manager Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run Persistent Task Manager Tests
        run: |
          python -m pytest -v tests/test_persistent_task_manager.py
