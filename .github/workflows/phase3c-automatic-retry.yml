name: Phase 3C-3 - Automatic Retry System

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase3c-automatic-retry
  cancel-in-progress: false

jobs:
  automatic-retry:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install pytest==8.3.5

      - name: Create Automatic Retry Controller
        run: |
          mkdir -p platform_core/task_queue

          cat > platform_core/task_queue/retry_controller.py <<'PY'
          from datetime import datetime, timezone, timedelta

          from platform_core.task_queue.task_lifecycle_manager import (
              TaskLifecycleManager,
          )


          class RetryController:

              def __init__(
                  self,
                  task_manager,
                  max_retries=3,
                  base_delay_seconds=60,
                  max_delay_seconds=3600,
                  clock=None,
              ):
                  if task_manager is None:
                      raise ValueError("TaskManager is required")

                  if max_retries < 0:
                      raise ValueError("max_retries cannot be negative")

                  if base_delay_seconds <= 0:
                      raise ValueError("base delay must be positive")

                  if max_delay_seconds <= 0:
                      raise ValueError("max delay must be positive")

                  self.task_manager = task_manager
                  self.lifecycle = TaskLifecycleManager(task_manager)
                  self.storage = task_manager.storage
                  self.storage_key = task_manager.STORAGE_KEY

                  self.max_retries = max_retries
                  self.base_delay_seconds = base_delay_seconds
                  self.max_delay_seconds = max_delay_seconds

                  self.clock = clock or (
                      lambda: datetime.now(timezone.utc)
                  )

              def _now(self):
                  value = self.clock()

                  if value.tzinfo is None:
                      value = value.replace(tzinfo=timezone.utc)

                  return value.astimezone(timezone.utc)

              def _load(self):
                  data = self.storage.get(self.storage_key)

                  if not isinstance(data, dict):
                      raise ValueError("Invalid task storage")

                  return data

              def _save(self, data):
                  return self.storage.set(self.storage_key, data)

              def calculate_delay(self, retry_number):
                  if retry_number < 1:
                      raise ValueError(
                          "retry_number must be positive"
                      )

                  delay = self.base_delay_seconds * (
                      2 ** (retry_number - 1)
                  )

                  return min(delay, self.max_delay_seconds)

              def handle_failure(self, task_id, error=None):
                  task = self.task_manager.get_task(task_id)

                  if task is None:
                      raise KeyError(task_id)

                  if task["status"] != "FAILED":
                      raise ValueError(
                          "Task must be FAILED before retry handling"
                      )

                  current_retries = task.get("retry_count", 0)

                  if current_retries >= self.max_retries:
                      return self.lifecycle.move_to_dead_letter(
                          task_id,
                          details={
                              "reason": "Maximum retries exceeded",
                              "error": error,
                          },
                      )

                  updated = self.lifecycle.schedule_retry(
                      task_id,
                      details={
                          "error": error,
                      },
                  )

                  retry_number = updated["retry_count"]
                  delay = self.calculate_delay(retry_number)

                  now = self._now()
                  next_retry = now + timedelta(seconds=delay)

                  data = self._load()
                  saved_task = data["tasks"][task_id]

                  saved_task["last_error"] = error
                  saved_task["backoff_seconds"] = delay
                  saved_task["next_retry_at"] = (
                      next_retry.isoformat()
                  )

                  self._save(data)

                  return self.task_manager.get_task(task_id)

              def get_due_retries(self):
                  now = self._now()

                  tasks = self.task_manager.list_tasks(
                      status="RETRY"
                  )

                  due = []

                  for task in tasks:
                      retry_at = task.get("next_retry_at")

                      if not retry_at:
                          continue

                      retry_time = datetime.fromisoformat(
                          retry_at
                      )

                      if retry_time.tzinfo is None:
                          retry_time = retry_time.replace(
                              tzinfo=timezone.utc
                          )

                      if retry_time <= now:
                          due.append(task)

                  return due

              def claim_due_retry(self, task_id):
                  due_ids = {
                      task["task_id"]
                      for task in self.get_due_retries()
                  }

                  if task_id not in due_ids:
                      return None

                  return self.lifecycle.mark_running(task_id)

              def process_due_retries(self):
                  results = []

                  for task in self.get_due_retries():
                      claimed = self.claim_due_retry(
                          task["task_id"]
                      )

                      if claimed is not None:
                          results.append(claimed)

                  return results
          PY

      - name: Create Automatic Retry Tests
        run: |
          mkdir -p tests

          cat > tests/test_phase3c_automatic_retry.py <<'PY'
          from datetime import datetime, timezone, timedelta

          import pytest

          from platform_core.storage.memory_storage import (
              InMemoryStorage,
          )

          from platform_core.task_queue.persistent_task_manager import (
              PersistentTaskManager,
          )

          from platform_core.task_queue.task_lifecycle_manager import (
              TaskLifecycleManager,
          )

          from platform_core.task_queue.retry_controller import (
              RetryController,
          )


          class FakeClock:

              def __init__(self):
                  self.current = datetime(
                      2026, 1, 1, 12, 0, 0,
                      tzinfo=timezone.utc,
                  )

              def __call__(self):
                  return self.current

              def advance(self, seconds):
                  self.current += timedelta(seconds=seconds)


          @pytest.fixture
          def setup():
              storage = InMemoryStorage()

              manager = PersistentTaskManager(storage)

              lifecycle = TaskLifecycleManager(manager)

              clock = FakeClock()

              retry = RetryController(
                  manager,
                  max_retries=3,
                  base_delay_seconds=60,
                  max_delay_seconds=3600,
                  clock=clock,
              )

              task = manager.create_task("example.worker")

              return (
                  manager,
                  lifecycle,
                  retry,
                  clock,
                  task["task_id"],
              )


          def fail_task(manager, lifecycle, task_id):
              status = manager.get_task(task_id)["status"]

              if status in ("PENDING", "RETRY"):
                  lifecycle.mark_running(task_id)

              elif status != "RUNNING":
                  raise ValueError(
                      f"Unexpected status: {status}"
                  )

              lifecycle.mark_failed(
                  task_id,
                  "Temporary error",
              )


          def test_first_retry_scheduled(setup):
              manager, lifecycle, retry, clock, task_id = setup

              fail_task(manager, lifecycle, task_id)

              task = retry.handle_failure(
                  task_id,
                  "Network error",
              )

              assert task["status"] == "RETRY"
              assert task["retry_count"] == 1
              assert task["backoff_seconds"] == 60


          def test_second_retry_uses_exponential_backoff(setup):
              manager, lifecycle, retry, clock, task_id = setup

              fail_task(manager, lifecycle, task_id)
              retry.handle_failure(task_id)

              fail_task(manager, lifecycle, task_id)

              task = retry.handle_failure(task_id)

              assert task["retry_count"] == 2
              assert task["backoff_seconds"] == 120


          def test_third_retry_uses_four_minutes(setup):
              manager, lifecycle, retry, clock, task_id = setup

              for _ in range(3):
                  fail_task(manager, lifecycle, task_id)

                  task = retry.handle_failure(task_id)

              assert task["status"] == "RETRY"
              assert task["retry_count"] == 3
              assert task["backoff_seconds"] == 240


          def test_maximum_delay_is_capped(setup):
              manager, lifecycle, retry, clock, task_id = setup

              assert retry.calculate_delay(10) == 3600


          def test_retry_not_due_immediately(setup):
              manager, lifecycle, retry, clock, task_id = setup

              fail_task(manager, lifecycle, task_id)
              retry.handle_failure(task_id)

              assert retry.get_due_retries() == []


          def test_retry_becomes_due_after_delay(setup):
              manager, lifecycle, retry, clock, task_id = setup

              fail_task(manager, lifecycle, task_id)
              retry.handle_failure(task_id)

              clock.advance(60)

              due = retry.get_due_retries()

              assert len(due) == 1
              assert due[0]["task_id"] == task_id


          def test_due_retry_can_be_claimed(setup):
              manager, lifecycle, retry, clock, task_id = setup

              fail_task(manager, lifecycle, task_id)
              retry.handle_failure(task_id)

              clock.advance(60)

              task = retry.claim_due_retry(task_id)

              assert task["status"] == "RUNNING"


          def test_early_retry_cannot_be_claimed(setup):
              manager, lifecycle, retry, clock, task_id = setup

              fail_task(manager, lifecycle, task_id)
              retry.handle_failure(task_id)

              assert retry.claim_due_retry(task_id) is None


          def test_retry_history_is_recorded(setup):
              manager, lifecycle, retry, clock, task_id = setup

              fail_task(manager, lifecycle, task_id)
              retry.handle_failure(task_id)

              history = lifecycle.get_history(task_id)

              assert any(
                  item["to_status"] == "RETRY"
                  for item in history
              )


          def test_maximum_retries_moves_task_to_dead_letter(setup):
              manager, lifecycle, retry, clock, task_id = setup

              for _ in range(3):
                  fail_task(manager, lifecycle, task_id)

                  retry.handle_failure(task_id)

                  if manager.get_task(task_id)["status"] == "RETRY":
                      lifecycle.mark_running(task_id)

              lifecycle.mark_failed(task_id)

              task = retry.handle_failure(task_id)

              assert task["status"] == "DEAD_LETTER"


          def test_retry_metadata_is_saved(setup):
              manager, lifecycle, retry, clock, task_id = setup

              fail_task(manager, lifecycle, task_id)

              task = retry.handle_failure(
                  task_id,
                  "Temporary API failure",
              )

              assert task["last_error"] == "Temporary API failure"
              assert task["next_retry_at"] is not None


          def test_due_retry_processing(setup):
              manager, lifecycle, retry, clock, task_id = setup

              fail_task(manager, lifecycle, task_id)
              retry.handle_failure(task_id)

              clock.advance(60)

              results = retry.process_due_retries()

              assert len(results) == 1
              assert results[0]["status"] == "RUNNING"


          def test_missing_task_raises_error(setup):
              manager, lifecycle, retry, clock, task_id = setup

              with pytest.raises(KeyError):
                  retry.handle_failure("missing-task")


          def test_non_failed_task_rejected(setup):
              manager, lifecycle, retry, clock, task_id = setup

              with pytest.raises(ValueError):
                  retry.handle_failure(task_id)


          def test_invalid_retry_number_rejected(setup):
              manager, lifecycle, retry, clock, task_id = setup

              with pytest.raises(ValueError):
                  retry.calculate_delay(0)
          PY

      - name: Run Automatic Retry Tests
        run: |
          python -m pytest tests/test_phase3c_automatic_retry.py -v

      - name: Compile Python Files
        run: |
          python -m compileall -q platform_core tests

      - name: Commit Phase 3C-3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add platform_core/task_queue/retry_controller.py
          git add tests/test_phase3c_automatic_retry.py

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add Phase 3C-3 automatic retry system"
            git push
          fi
