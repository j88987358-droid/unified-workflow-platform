name: Phase 3C-6B Python Storage Adapter

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase3c6b-storage-adapter
  cancel-in-progress: false

jobs:
  storage-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install pytest==8.3.5 requests==2.32.5

      - name: Create Python Storage Adapter
        run: |
          mkdir -p platform_core/storage
          mkdir -p tests

          cat > platform_core/storage/apps_script_storage.py <<'PY'
          import requests

          class AppsScriptStorage:
              def __init__(
                  self,
                  url,
                  token,
                  timeout=45,
                  session=None
              ):
                  if not url or not token:
                      raise ValueError(
                          "Apps Script URL and token are required"
                      )

                  if not url.startswith(
                      "https://script.google.com/"
                  ):
                      raise ValueError("Invalid Apps Script URL")

                  self.url = url
                  self.token = token
                  self.timeout = timeout
                  self.session = session or requests.Session()

              def _request(self, action, key=None, value=None):
                  payload = {
                      "token": self.token,
                      "action": action
                  }

                  if key is not None:
                      payload["key"] = key

                  if value is not None:
                      payload["value"] = value

                  try:
                      response = self.session.post(
                          self.url,
                          json=payload,
                          timeout=self.timeout,
                          allow_redirects=True
                      )

                      response.raise_for_status()
                      result = response.json()

                  except requests.RequestException as exc:
                      raise RuntimeError(
                          f"Storage network error: {exc}"
                      ) from exc

                  except ValueError as exc:
                      raise RuntimeError(
                          "Storage API returned invalid JSON"
                      ) from exc

                  if not isinstance(result, dict):
                      raise RuntimeError(
                          "Invalid storage API response"
                      )

                  if not result.get("success"):
                      raise RuntimeError(
                          f"Storage API error: {result.get('error')}"
                      )

                  return result

              def get(self, key):
                  result = self._request("get", key=key)

                  if not result.get("found"):
                      return None

                  return result.get("value")

              def set(self, key, value):
                  return self._request(
                      "set",
                      key=key,
                      value=value
                  )

              def delete(self, key):
                  return self._request(
                      "delete",
                      key=key
                  )

              def health_check(self):
                  result = self._request("ping")
                  return result.get("status") == "CONNECTED"
          PY

      - name: Create Adapter Tests
        run: |
          cat > tests/test_phase3c6b_storage_adapter.py <<'PY'
          import pytest

          from platform_core.storage.apps_script_storage import (
              AppsScriptStorage
          )

          class FakeResponse:
              def __init__(self, data):
                  self.data = data

              def raise_for_status(self):
                  pass

              def json(self):
                  return self.data

          class FakeSession:
              def __init__(self):
                  self.data = {}
                  self.calls = []

              def post(self, url, json, **kwargs):
                  self.calls.append(json)
                  action = json["action"]
                  key = json.get("key")

                  if action == "ping":
                      return FakeResponse({
                          "success": True,
                          "status": "CONNECTED"
                      })

                  if action == "set":
                      self.data[key] = json["value"]
                      return FakeResponse({
                          "success": True,
                          "action": "SET"
                      })

                  if action == "get":
                      found = key in self.data
                      return FakeResponse({
                          "success": True,
                          "found": found,
                          "value": self.data.get(key)
                      })

                  if action == "delete":
                      self.data.pop(key, None)
                      return FakeResponse({
                          "success": True,
                          "action": "DELETE"
                      })

                  return FakeResponse({
                      "success": False,
                      "error": "UNKNOWN_ACTION"
                  })

          def make_storage(session=None):
              return AppsScriptStorage(
                  "https://script.google.com/macros/s/test/exec",
                  "test-token",
                  session=session or FakeSession()
              )

          def test_constructor_validation():
              with pytest.raises(ValueError):
                  AppsScriptStorage("", "token")

              with pytest.raises(ValueError):
                  AppsScriptStorage(
                      "https://invalid.example/api",
                      "token"
                  )

          def test_health_check():
              storage = make_storage()
              assert storage.health_check() is True

          def test_set_and_get():
              session = FakeSession()
              storage = make_storage(session)

              value = {
                  "task_id": "task-001",
                  "status": "PENDING",
                  "retry_count": 2
              }

              storage.set("task:001", value)

              assert storage.get("task:001") == value

          def test_missing_key():
              storage = make_storage()
              assert storage.get("missing") is None

          def test_update():
              storage = make_storage()

              storage.set("task:001", {"status": "PENDING"})
              storage.set("task:001", {"status": "SUCCESS"})

              assert storage.get("task:001") == {
                  "status": "SUCCESS"
              }

          def test_delete():
              storage = make_storage()

              storage.set("task:001", {"status": "PENDING"})
              storage.delete("task:001")

              assert storage.get("task:001") is None

          def test_invalid_api_response():
              class BadSession:
                  def post(self, *args, **kwargs):
                      return FakeResponse({
                          "success": False,
                          "error": "UNAUTHORIZED"
                      })

              storage = make_storage(BadSession())

              with pytest.raises(RuntimeError):
                  storage.get("task:001")

          def test_independent_adapter_instances():
              shared_session = FakeSession()

              storage_a = make_storage(shared_session)
              storage_b = make_storage(shared_session)

              storage_a.set(
                  "persistent:test",
                  {"status": "PENDING"}
              )

              assert storage_b.get(
                  "persistent:test"
              ) == {"status": "PENDING"}
          PY

      - name: Run Unit Tests
        run: |
          pytest -v tests/test_phase3c6b_storage_adapter.py

      - name: Live Google Sheets Integration Test
        env:
          APPS_SCRIPT_URL: ${{ secrets.GOOGLE_APPS_SCRIPT_URL }}
          APPS_SCRIPT_TOKEN: ${{ secrets.GOOGLE_APPS_SCRIPT_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import uuid

          from platform_core.storage.apps_script_storage import (
              AppsScriptStorage
          )

          url = os.environ.get("APPS_SCRIPT_URL", "").strip()
          token = os.environ.get("APPS_SCRIPT_TOKEN", "").strip()

          if not url or not token:
              raise SystemExit("Required GitHub Secrets missing")

          storage_a = AppsScriptStorage(url, token)
          storage_b = AppsScriptStorage(url, token)

          print("TEST 1: API Health")

          assert storage_a.health_check()
          print("PASS")

          key = "phase3c6b:adapter:" + str(uuid.uuid4())

          value = {
              "task_id": "adapter-test-001",
              "status": "PENDING",
              "retry_count": 2,
              "payload": {
                  "source": "github-actions"
              }
          }

          print("TEST 2: Persistent Write")

          storage_a.set(key, value)
          print("PASS")

          print("TEST 3: Read From Independent Adapter")

          assert storage_b.get(key) == value
          print("PASS")

          print("TEST 4: Update")

          updated = {
              **value,
              "status": "SUCCESS"
          }

          storage_b.set(key, updated)

          assert storage_a.get(key) == updated
          print("PASS")

          print("TEST 5: Delete")

          storage_a.delete(key)

          assert storage_b.get(key) is None
          print("PASS")

          print("ALL PHASE 3C-6B TESTS PASSED")
          PY
