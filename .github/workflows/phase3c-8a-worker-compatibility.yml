name: Phase 3C-8A Worker Compatibility

on:
workflow_dispatch:

permissions:
contents: write

jobs:
worker-compatibility:
runs-on: ubuntu-latest

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Install Dependencies
    run: |
      python -m pip install --upgrade pip
      pip install pytest requests

  - name: Verify Required Files
    run: |
      test -f platform_core/execution/execution_engine.py
      test -f platform_core/plugin_system/worker_manager.py
      echo "Required files verified."

  - name: Add Worker Input Compatibility
    run: |
      python - <<'PY'
      from pathlib import Path

      path = Path("platform_core/execution/execution_engine.py")
      source = path.read_text(encoding="utf-8")

      method = '''    def _get_worker_input(self, worker_id, task):
              worker = self.worker_manager.workers.get(worker_id)

              if worker is None:
                  raise KeyError(f"Worker not registered: {worker_id}")

              input_mode = getattr(worker, "task_input_mode", "payload")

              if input_mode == "payload":
                  payload = task.get("payload") or {}
                  return payload.get("data", {})

              if input_mode == "full_task":
                  return task

              raise ValueError(
                  f"Unsupported task_input_mode for {worker_id}: {input_mode}"
              )

      '''

      if "def _get_worker_input(self, worker_id, task):" not in source:
          marker = "    def _execute_running_task(self, task):"
          if source.count(marker) != 1:
              raise RuntimeError(
                  "Could not safely locate _execute_running_task."
              )
          source = source.replace(marker, method + marker, 1)

      old = "result = self.worker_manager.execute(worker_id, task)"
      new = (
          "worker_input = self._get_worker_input(worker_id, task)\n"
          "            result = self.worker_manager.execute(worker_id, worker_input)"
      )

      if old in source:
          source = source.replace(old, new, 1)
      elif new not in source:
          raise RuntimeError(
              "Could not safely locate Worker execution call."
          )

      path.write_text(source, encoding="utf-8")
      print("Worker compatibility implemented.")
      PY

  - name: Create Compatibility Tests
    run: |
      mkdir -p tests

      cat > tests/test_phase3c8a_worker_compatibility.py <<'PY'
      from platform_core.execution.execution_engine import ExecutionEngine


      TASK = {
          "task_id": "test-001",
          "task_type": "test_worker",
          "status": "RUNNING",
          "payload": {
              "worker_id": "test_worker",
              "data": {
                  "business": "HVAC Contractor",
                  "location": "Tampa"
              }
          }
      }


      class LegacyWorker:
          pass


      class NewWorker:
          task_input_mode = "full_task"


      class WorkerManager:
          def __init__(self, worker):
              self.workers = {"test_worker": worker}
              self.status = {"test_worker": "READY"}
              self.received_input = None

          def health_check(self, worker_id):
              return True

          def start(self, worker_id):
              self.status[worker_id] = "READY"

          def execute(self, worker_id, task_input):
              self.received_input = task_input
              return {"success": True}


      class TaskManager:
          def get_task(self, task_id):
              return TASK.copy()


      class LifecycleManager:
          def mark_success(self, task_id, details=None):
              return {
                  "task_id": task_id,
                  "status": "SUCCESS",
                  "details": details
              }

          def mark_failed(self, task_id, details=None):
              return {
                  "task_id": task_id,
                  "status": "FAILED"
              }


      def build_engine(worker):
          engine = ExecutionEngine.__new__(ExecutionEngine)
          engine.worker_manager = WorkerManager(worker)
          engine.task_manager = TaskManager()
          engine.lifecycle_manager = LifecycleManager()
          engine.retry_controller = None
          return engine


      def test_legacy_worker_receives_payload_data():
          engine = build_engine(LegacyWorker())

          result = engine._execute_running_task(TASK)

          assert result["status"] == "SUCCESS"
          assert engine.worker_manager.received_input == {
              "business": "HVAC Contractor",
              "location": "Tampa"
          }


      def test_new_worker_receives_full_task():
          engine = build_engine(NewWorker())

          result = engine._execute_running_task(TASK)

          assert result["status"] == "SUCCESS"
          assert engine.worker_manager.received_input == TASK


      def test_payload_mode_is_default():
          engine = build_engine(LegacyWorker())

          received = engine._get_worker_input("test_worker", TASK)

          assert received == TASK["payload"]["data"]


      def test_full_task_mode_is_explicit():
          engine = build_engine(NewWorker())

          received = engine._get_worker_input("test_worker", TASK)

          assert received == TASK


      def test_unknown_input_mode_is_rejected():
          class InvalidWorker:
              task_input_mode = "unknown"

          engine = build_engine(InvalidWorker())

          try:
              engine._get_worker_input("test_worker", TASK)
          except ValueError:
              return

          raise AssertionError("Unknown input mode was not rejected.")
      PY

  - name: Run Compatibility Tests
    env:
      PYTHONPATH: ${{ github.workspace }}
    run: |
      python -m pytest -q tests/test_phase3c8a_worker_compatibility.py

  - name: Compile Platform
    run: |
      python -m compileall -q platform_core

  - name: Commit Changes
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add platform_core/execution/execution_engine.py
      git add tests/test_phase3c8a_worker_compatibility.py

      git diff --cached --quiet || git commit -m "Add legacy and new worker input compatibility"
      git push
