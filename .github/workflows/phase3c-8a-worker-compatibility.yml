name: Phase 3C-8A Worker Compatibility

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  worker-compatibility:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests

      # --------------------------------------------------
      # 1. Update BaseWorker Contract
      # --------------------------------------------------

      - name: Update BaseWorker Contract
        run: |
          cat > platform_core/contracts/base_worker.py <<'PY'
          from abc import ABC, abstractmethod


          class BaseWorker(ABC):

              name = None
              version = "1.0.0"

              # Modern workers receive the complete task.
              task_input_mode = "full_task"

              @abstractmethod
              def initialize(self, context):
                  pass

              @abstractmethod
              def execute(self, task):
                  pass

              @abstractmethod
              def health_check(self):
                  pass

              def shutdown(self):
                  pass
          PY

      # --------------------------------------------------
      # 2. Update ExecutionEngine
      # --------------------------------------------------

      - name: Update Execution Engine
        run: |
          cat > platform_core/execution/execution_engine.py <<'PY'
          class ExecutionEngine:

              def __init__(
                  self,
                  task_manager,
                  lifecycle_manager,
                  retry_controller,
                  worker_manager,
              ):
                  if task_manager is None:
                      raise ValueError("TaskManager required")

                  if lifecycle_manager is None:
                      raise ValueError("LifecycleManager required")

                  if retry_controller is None:
                      raise ValueError("RetryController required")

                  if worker_manager is None:
                      raise ValueError("WorkerManager required")

                  self.task_manager = task_manager
                  self.lifecycle = lifecycle_manager
                  self.retry_controller = retry_controller
                  self.worker_manager = worker_manager

              def _get_worker_id(self, task):
                  payload = task.get("payload") or {}

                  worker_id = payload.get("worker_id")

                  if not worker_id:
                      worker_id = task.get("task_type")

                  if not worker_id:
                      raise ValueError("Task has no worker_id")

                  return worker_id

              def _get_worker_input(self, worker_id, task):
                  worker = self.worker_manager.workers.get(
                      worker_id
                  )

                  if worker is None:
                      raise KeyError(
                          f"Worker not registered: {worker_id}"
                      )

                  # Modern BaseWorker defaults to full_task.
                  # Legacy workers default to payload.
                  input_mode = getattr(
                      worker,
                      "task_input_mode",
                      "payload"
                  )

                  if input_mode == "payload":
                      payload = task.get("payload") or {}
                      return payload.get("data", {})

                  if input_mode == "full_task":
                      return task

                  raise ValueError(
                      f"Unsupported task_input_mode: {input_mode}"
                  )

              def _ensure_worker_ready(self, worker_id):
                  if worker_id not in self.worker_manager.workers:
                      raise KeyError(
                          f"Worker not registered: {worker_id}"
                      )

                  status = self.worker_manager.status.get(
                      worker_id
                  )

                  if status != "READY":
                      self.worker_manager.start(worker_id)

                  if not self.worker_manager.health_check(
                      worker_id
                  ):
                      raise RuntimeError(
                          f"Worker unhealthy: {worker_id}"
                      )

              def _execute_running_task(self, task):
                  task_id = task["task_id"]

                  try:
                      worker_id = self._get_worker_id(task)

                      self._ensure_worker_ready(worker_id)

                      worker_input = self._get_worker_input(
                          worker_id,
                          task
                      )

                      result = self.worker_manager.execute(
                          worker_id,
                          worker_input
                      )

                      self.lifecycle.mark_success(
                          task_id,
                          details={
                              "result": result
                          }
                      )

                      return {
                          "task_id": task_id,
                          "status": "SUCCESS",
                          "result": result
                      }

                  except Exception as exc:

                      current = self.task_manager.get_task(
                          task_id
                      )

                      if current is None:
                          raise KeyError(task_id)

                      if current["status"] != "RUNNING":
                          raise

                      self.lifecycle.mark_failed(
                          task_id,
                          details={
                              "error": str(exc)
                          }
                      )

                      return self.retry_controller.handle_failure(
                          task_id,
                          error=str(exc)
                      )

              def execute_task(self, task_id):
                  task = self.task_manager.get_task(task_id)

                  if task is None:
                      raise KeyError(task_id)

                  if task["status"] == "PENDING":

                      task = self.lifecycle.mark_running(
                          task_id
                      )

                  elif task["status"] != "RUNNING":

                      raise ValueError(
                          f"Task cannot execute from status "
                          f"{task['status']}"
                      )

                  return self._execute_running_task(task)

              def process_pending_tasks(self, max_tasks=100):
                  if (
                      not isinstance(max_tasks, int)
                      or isinstance(max_tasks, bool)
                      or max_tasks < 1
                  ):
                      raise ValueError(
                          "max_tasks must be a positive integer"
                      )

                  results = []

                  for _ in range(max_tasks):

                      task = (
                          self.task_manager.get_next_pending_task()
                      )

                      if task is None:
                          break

                      result = self.execute_task(
                          task["task_id"]
                      )

                      results.append(result)

                  return results

              def process_due_retries(self):

                  due_tasks = (
                      self.retry_controller.process_due_retries()
                  )

                  results = []

                  for task in due_tasks:

                      result = self._execute_running_task(
                          task
                      )

                      results.append(result)

                  return results

              def run_once(self, max_tasks=100):

                  return {
                      "pending_results": (
                          self.process_pending_tasks(
                              max_tasks=max_tasks
                          )
                      ),

                      "retry_results": (
                          self.process_due_retries()
                      )
                  }
          PY

      # --------------------------------------------------
      # 3. Preserve Runtime API Compatibility
      # --------------------------------------------------

      - name: Update Architecture Runtime
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("platform_core/runtime.py")
          source = path.read_text(encoding="utf-8")

          old = "        result = self.execution_engine.execute_task(task_id)\n"

          new = (
              old
              + '        if result.get("status") == "RETRY":\n'
              + '            result = {**result, "execution_status": "RETRY", "status": "FAILED"}\n'
          )

          count = source.count(old)

          if count != 1:
              raise RuntimeError(
                  f"Expected exactly one Runtime execute_task call, "
                  f"found {count}. No automatic replacement was performed."
              )

          source = source.replace(old, new, 1)

          path.write_text(source, encoding="utf-8")

          print("Runtime compatibility updated successfully.")
          PY

      # --------------------------------------------------
      # 4. Add Compatibility Tests
      # --------------------------------------------------

      - name: Create Compatibility Tests
        run: |
          mkdir -p tests

          cat > tests/test_phase3c8a_worker_compatibility.py <<'PY'
          import pytest

          from platform_core.contracts.base_worker import BaseWorker
          from platform_core.execution.execution_engine import ExecutionEngine
          from platform_core.plugin_system.worker_manager import WorkerManager
          from platform_core.storage.memory_storage import InMemoryStorage
          from platform_core.task_queue.persistent_task_manager import PersistentTaskManager
          from platform_core.task_queue.task_lifecycle_manager import TaskLifecycleManager
          from platform_core.task_queue.retry_controller import RetryController


          class ModernWorker(BaseWorker):

              name = "modern.worker"

              def initialize(self, context):
                  self.ready = True

              def execute(self, task):
                  return {
                      "received": task
                  }

              def health_check(self):
                  return True


          class LegacyWorker:

              def initialize(self, context):
                  self.ready = True

              def execute(self, task):
                  return {
                      "received": task
                  }

              def health_check(self):
                  return True


          class ExplicitFullTaskWorker(LegacyWorker):
              task_input_mode = "full_task"


          class InvalidWorker(LegacyWorker):
              task_input_mode = "invalid"


          @pytest.fixture
          def setup():
              storage = InMemoryStorage()

              manager = PersistentTaskManager(storage)

              lifecycle = TaskLifecycleManager(manager)

              retry = RetryController(
                  manager,
                  max_retries=3
              )

              workers = WorkerManager()

              workers.register(
                  "modern.worker",
                  ModernWorker()
              )

              workers.register(
                  "legacy.worker",
                  LegacyWorker()
              )

              workers.register(
                  "explicit.worker",
                  ExplicitFullTaskWorker()
              )

              workers.register(
                  "invalid.worker",
                  InvalidWorker()
              )

              engine = ExecutionEngine(
                  manager,
                  lifecycle,
                  retry,
                  workers
              )

              return manager, lifecycle, retry, workers, engine


          def make_task(worker_id):
              return {
                  "task_id": "compatibility-test",
                  "task_type": worker_id,
                  "status": "RUNNING",
                  "payload": {
                      "worker_id": worker_id,
                      "data": {
                          "value": 123
                      }
                  }
              }


          def test_base_worker_defaults_to_full_task():
              worker = ModernWorker()

              assert worker.task_input_mode == "full_task"


          def test_modern_worker_receives_full_task(setup):
              manager, lifecycle, retry, workers, engine = setup

              task = make_task("modern.worker")

              received = engine._get_worker_input(
                  "modern.worker",
                  task
              )

              assert received == task


          def test_legacy_worker_receives_payload(setup):
              manager, lifecycle, retry, workers, engine = setup

              task = make_task("legacy.worker")

              received = engine._get_worker_input(
                  "legacy.worker",
                  task
              )

              assert received == {
                  "value": 123
              }


          def test_explicit_full_task_mode(setup):
              manager, lifecycle, retry, workers, engine = setup

              task = make_task("explicit.worker")

              received = engine._get_worker_input(
                  "explicit.worker",
                  task
              )

              assert received == task


          def test_invalid_input_mode_rejected(setup):
              manager, lifecycle, retry, workers, engine = setup

              task = make_task("invalid.worker")

              with pytest.raises(ValueError):
                  engine._get_worker_input(
                      "invalid.worker",
                      task
                  )


          def test_unregistered_worker_rejected(setup):
              manager, lifecycle, retry, workers, engine = setup

              with pytest.raises(KeyError):
                  engine._get_worker_input(
                      "missing.worker",
                      make_task("missing.worker")
                  )


          def test_success_returns_legacy_result_structure(setup):
              manager, lifecycle, retry, workers, engine = setup

              task = manager.create_task(
                  "legacy.worker",
                  payload={
                      "worker_id": "legacy.worker",
                      "data": {
                          "value": 123
                      }
                  }
              )

              result = engine.execute_task(
                  task["task_id"]
              )

              assert result["status"] == "SUCCESS"
              assert "result" in result
              assert result["result"]["received"] == {
                  "value": 123
              }


          def test_modern_worker_receives_complete_task_during_execution(setup):
              manager, lifecycle, retry, workers, engine = setup

              task = manager.create_task(
                  "modern.worker",
                  payload={
                      "worker_id": "modern.worker",
                      "data": {
                          "value": 123
                      }
                  }
              )

              result = engine.execute_task(
                  task["task_id"]
              )

              assert result["status"] == "SUCCESS"

              received = result["result"]["received"]

              assert received["task_id"] == task["task_id"]
              assert received["payload"]["data"]["value"] == 123
          PY

      # --------------------------------------------------
      # 5. Compile
      # --------------------------------------------------

      - name: Compile Platform
        run: |
          python -m compileall -q platform_core

      # --------------------------------------------------
      # 6. Run New Tests
      # --------------------------------------------------

      - name: Run Phase 3C-8A Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -v \
            tests/test_phase3c8a_worker_compatibility.py

      # --------------------------------------------------
      # 7. Run ALL Existing Tests
      # --------------------------------------------------

      - name: Run Full Regression Test Suite
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -v tests/

      # --------------------------------------------------
      # 8. Commit
      # --------------------------------------------------

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add platform_core/contracts/base_worker.py
          git add platform_core/execution/execution_engine.py
          git add platform_core/runtime.py
          git add tests/test_phase3c8a_worker_compatibility.py

          git diff --cached --quiet || \
            git commit -m "Fix Phase 3C-8A worker compatibility"

          git push
